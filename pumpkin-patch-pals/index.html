<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pumpkin Patch Pals</title>
  <meta name="description" content="Fall and Halloween classroom games for PreK to 2nd grade: decorate a pumpkin, counting, ten frames, letters, sounds, rhyming, patterns, life cycle, memory and feelings.">
  <meta name="theme-color" content="#3b2f63">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Home">
      <span class="brand-icon" data-art="pumpkin"></span>
      <span class="brand-name">Pumpkin Patch Pals</span>
    </button>
    <div class="stars" aria-live="polite"><span class="star-icon" data-art="star"></span><span id="starCount">0</span></div>
    <div class="tools">
      <button class="tool" id="soundBtn" aria-pressed="true" title="Sound effects on/off">🔔</button>
      <button class="tool" id="voiceBtn" aria-pressed="true" title="Read-aloud on/off">🗣️</button>
      <button class="tool" id="fullBtn" title="Full screen">⛶</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="confetti" aria-hidden="true"></div>
  <noscript><p class="noscript">Please turn on JavaScript to play Pumpkin Patch Pals.</p></noscript>

  <script src="art.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
