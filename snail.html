<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snail Escape</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #7ec850;
    font-family: system-ui, sans-serif;
    user-select: none;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: rgba(40, 20, 60, 0.55);
    text-align: center;
    padding: 16px;
  }
  #overlay h1 { font-size: 3rem; margin: 0 0 8px; text-shadow: 0 3px 0 #b0306a; }
  #overlay p { font-size: 1.1rem; margin: 6px 0; }
  #overlay button {
    margin-top: 20px;
    font-size: 1.3rem;
    padding: 12px 32px;
    border: none;
    border-radius: 999px;
    background: #ff6fae;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 0 #b0306a;
  }
  #overlay button:hover { background: #ff85bb; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1 id="title">Snail Escape</h1>
  <p id="subtitle">The snails are after Lily! Help her run away!</p>
  <p>Move with the arrow keys or WASD (or drag your finger on a phone).</p>
  <p>Grab flowers for points. Don't let the snails touch you!</p>
  <button id="start">Start</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const startBtn = document.getElementById('start');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const SHELLS = ['#c97b3a', '#d9a441', '#b5651d', '#e07a5f', '#9c6644'];
const FLOWER_COLORS = ['#ff5d8f', '#ffd23f', '#a06cd5', '#4cc9f0', '#ff8c42'];

const keys = {};
const touch = { active: false, x: 0, y: 0 };
let girl, snails, flowers, trails, sparkles, score, time, spawnTimer, flowerTimer, running, best = 0;

// Grass tufts so the field doesn't look empty
let tufts = [];
function makeTufts() {
  tufts = [];
  for (let i = 0; i < (W * H) / 9000; i++) {
    tufts.push({ x: Math.random() * W, y: Math.random() * H, s: 0.6 + Math.random() * 0.8 });
  }
}

function reset() {
  girl = { x: W / 2, y: H / 2, r: 16, speed: 4.2, lives: 3, hurt: 0, step: 0, facing: 1, moving: false };
  snails = [];
  flowers = [];
  trails = [];
  sparkles = [];
  score = 0;
  time = 0;
  spawnTimer = 60;
  flowerTimer = 0;
  makeTufts();
  for (let i = 0; i < 3; i++) spawnFlower();
}

function spawnSnail() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const minutes = time / 3600;
  const zoomy = Math.random() < Math.min(0.05 + minutes * 0.15, 0.35);
  snails.push({
    x, y,
    r: zoomy ? 13 : 16 + Math.random() * 6,
    speed: zoomy ? 2.6 + minutes * 0.4 : 0.9 + Math.random() * 0.6 + minutes * 0.5,
    shell: zoomy ? '#e63946' : SHELLS[Math.floor(Math.random() * SHELLS.length)],
    zoomy,
    wiggle: Math.random() * Math.PI * 2,
    trailTimer: 0,
    dir: 1,
  });
}

function spawnFlower() {
  flowers.push({
    x: 40 + Math.random() * (W - 80),
    y: 70 + Math.random() * (H - 110),
    color: FLOWER_COLORS[Math.floor(Math.random() * FLOWER_COLORS.length)],
    bob: Math.random() * Math.PI * 2,
  });
}

function sparkle(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    sparkles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 30, color });
  }
}

function update() {
  time++;

  // Move the girl
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp || keys.w) dy -= 1;
  if (keys.ArrowDown || keys.s) dy += 1;
  if (touch.active) {
    const tx = touch.x - girl.x, ty = touch.y - girl.y;
    const td = Math.hypot(tx, ty);
    if (td > 8) { dx = tx / td; dy = ty / td; }
  }
  const len = Math.hypot(dx, dy);
  girl.moving = len > 0;
  if (girl.moving) {
    girl.x += (dx / len) * girl.speed;
    girl.y += (dy / len) * girl.speed;
    girl.step += 0.3;
    if (dx !== 0) girl.facing = dx > 0 ? 1 : -1;
  }
  girl.x = Math.max(girl.r, Math.min(W - girl.r, girl.x));
  girl.y = Math.max(girl.r + 20, Math.min(H - girl.r, girl.y));
  if (girl.hurt > 0) girl.hurt--;

  // More snails over time
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnSnail();
    spawnTimer = Math.max(25, 140 - time / 30);
  }
  // Score for staying alive
  if (time % 60 === 0) score++;

  // Flowers
  flowerTimer++;
  if (flowerTimer > 180 && flowers.length < 5) {
    spawnFlower();
    flowerTimer = 0;
  }
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i];
    f.bob += 0.05;
    if (Math.hypot(f.x - girl.x, f.y - girl.y) < girl.r + 14) {
      score += 10;
      sparkle(f.x, f.y, f.color, 14);
      flowers.splice(i, 1);
    }
  }

  // Snails slide toward her, leaving slime
  for (const s of snails) {
    const sx = girl.x - s.x, sy = girl.y - s.y;
    const d = Math.hypot(sx, sy);
    s.wiggle += 0.15;
    const pulse = 0.75 + Math.sin(s.wiggle) * 0.25;
    s.x += (sx / d) * s.speed * pulse;
    s.y += (sy / d) * s.speed * pulse;
    if (Math.abs(sx) > 2) s.dir = sx > 0 ? 1 : -1;
    if (++s.trailTimer > 6) {
      trails.push({ x: s.x, y: s.y + s.r * 0.5, r: s.r * 0.45, life: 240 });
      s.trailTimer = 0;
    }
    if (girl.hurt === 0 && d < s.r + girl.r - 6) {
      girl.lives--;
      girl.hurt = 90;
      sparkle(girl.x, girl.y, '#ffffff', 16);
      // Push nearby snails back so she has room to escape
      for (const o of snails) {
        const ox = o.x - girl.x, oy = o.y - girl.y;
        const od = Math.hypot(ox, oy) || 1;
        if (od < 160) { o.x += (ox / od) * 120; o.y += (oy / od) * 120; }
      }
      if (girl.lives <= 0) { gameOver(); return; }
    }
  }

  for (let i = trails.length - 1; i >= 0; i--) {
    if (--trails[i].life <= 0) trails.splice(i, 1);
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const p = sparkles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    if (--p.life <= 0) sparkles.splice(i, 1);
  }
}

function drawField() {
  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#5fa83a';
  ctx.lineWidth = 2;
  for (const t of tufts) {
    ctx.beginPath();
    ctx.moveTo(t.x - 4 * t.s, t.y); ctx.lineTo(t.x - 6 * t.s, t.y - 8 * t.s);
    ctx.moveTo(t.x, t.y); ctx.lineTo(t.x, t.y - 10 * t.s);
    ctx.moveTo(t.x + 4 * t.s, t.y); ctx.lineTo(t.x + 6 * t.s, t.y - 8 * t.s);
    ctx.stroke();
  }
  for (const tr of trails) {
    ctx.fillStyle = `rgba(220, 240, 255, ${(tr.life / 240) * 0.45})`;
    ctx.beginPath(); ctx.ellipse(tr.x, tr.y, tr.r * 1.4, tr.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFlower(f) {
  const y = f.y + Math.sin(f.bob) * 2;
  ctx.strokeStyle = '#2d8a3e';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(f.x, y); ctx.lineTo(f.x, y + 16); ctx.stroke();
  ctx.fillStyle = f.color;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + f.bob * 0.3;
    ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * 7, y + Math.sin(a) * 7, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.arc(f.x, y, 5, 0, Math.PI * 2); ctx.fill();
}

function drawSnail(s) {
  const r = s.r;
  const squish = 1 + Math.sin(s.wiggle) * 0.08;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(s.dir, 1);

  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.75, r * 1.5, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();

  // Squishy body
  ctx.fillStyle = s.zoomy ? '#c7e9b0' : '#d9c8a9';
  ctx.beginPath(); ctx.ellipse(r * 0.2, r * 0.45, r * 1.45 * squish, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  // Head and eye stalks
  ctx.beginPath(); ctx.arc(r * 1.25 * squish, r * 0.2, r * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = ctx.fillStyle;
  ctx.lineWidth = 3;
  const wob = Math.sin(s.wiggle * 1.3) * 2;
  ctx.beginPath();
  ctx.moveTo(r * 1.2 * squish, r * 0.05); ctx.lineTo(r * 1.15 * squish + wob, -r * 0.75);
  ctx.moveTo(r * 1.4 * squish, r * 0.05); ctx.lineTo(r * 1.6 * squish - wob, -r * 0.65);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(r * 1.15 * squish + wob, -r * 0.8, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 1.6 * squish - wob, -r * 0.7, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(r * 1.2 * squish + wob, -r * 0.8, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 1.65 * squish - wob, -r * 0.7, 2, 0, Math.PI * 2); ctx.fill();

  // Shell with a spiral
  ctx.fillStyle = s.shell;
  ctx.beginPath(); ctx.arc(-r * 0.15, -r * 0.05, r * 0.85, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let a = 0; a < Math.PI * 5; a += 0.2) {
    const sr = (a / (Math.PI * 5)) * r * 0.75;
    const px = -r * 0.15 + Math.cos(a) * sr, py = -r * 0.05 + Math.sin(a) * sr;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  if (s.zoomy) {
    // Speed lines for the fast ones
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(-r * 1.4, -r * 0.3); ctx.lineTo(-r * 2.1, -r * 0.3);
    ctx.moveTo(-r * 1.3, r * 0.1); ctx.lineTo(-r * 2.2, r * 0.1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGirl() {
  // Blink while hurt
  if (girl.hurt > 0 && Math.floor(girl.hurt / 6) % 2 === 0) return;
  const g = girl;
  const legSwing = g.moving ? Math.sin(g.step) * 6 : 0;
  const bounce = g.moving ? Math.abs(Math.sin(g.step)) * 2 : 0;
  ctx.save();
  ctx.translate(g.x, g.y - bounce);
  ctx.scale(g.facing, 1);

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 26 + bounce, 14, 4, 0, 0, Math.PI * 2); ctx.fill();

  // Legs and shoes
  ctx.strokeStyle = '#8d5524';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-4, 12); ctx.lineTo(-4 + legSwing, 23);
  ctx.moveTo(4, 12); ctx.lineTo(4 - legSwing, 23);
  ctx.stroke();
  ctx.fillStyle = '#e63974';
  ctx.beginPath(); ctx.ellipse(-3 + legSwing, 24, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5 - legSwing, 24, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();

  // Dress
  ctx.fillStyle = '#ff6fae';
  ctx.beginPath();
  ctx.moveTo(-6, -4); ctx.lineTo(6, -4); ctx.lineTo(12, 14); ctx.lineTo(-12, 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-12, 12, 24, 2);

  // Arms pumping
  ctx.strokeStyle = '#8d5524';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-5, -1); ctx.lineTo(-10 - legSwing * 0.6, 8);
  ctx.moveTo(5, -1); ctx.lineTo(10 + legSwing * 0.6, 8);
  ctx.stroke();

  // Hair (back) and pigtails
  ctx.fillStyle = '#3b2314';
  ctx.beginPath(); ctx.arc(0, -15, 11, 0, Math.PI * 2); ctx.fill();
  const tailBob = g.moving ? Math.sin(g.step + 1) * 3 : 0;
  ctx.beginPath(); ctx.ellipse(-12, -12 + tailBob, 4, 7, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -12 - tailBob, 4, 7, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(-10, -17, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -17, 2.5, 0, Math.PI * 2); ctx.fill();

  // Face
  ctx.fillStyle = '#a9713f';
  ctx.beginPath(); ctx.arc(1, -13, 8.5, 0, Math.PI * 2); ctx.fill();
  // Fringe
  ctx.fillStyle = '#3b2314';
  ctx.beginPath(); ctx.arc(0, -17, 9, Math.PI, Math.PI * 2); ctx.fill();
  // Eyes (worried when snails are close!)
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-1, -13, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -13, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 120, 150, 0.6)';
  ctx.beginPath(); ctx.arc(-3, -10, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -10, 1.8, 0, Math.PI * 2); ctx.fill();
  // Mouth: little "o" of surprise while running
  ctx.fillStyle = '#6b2a2a';
  ctx.beginPath(); ctx.ellipse(2.5, -8.5, 1.6, g.moving ? 2 : 1, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawHeart(x, y, filled) {
  ctx.fillStyle = filled ? '#ff3b6b' : 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(x, y + 5);
  ctx.bezierCurveTo(x, y + 2, x - 9, y - 4, x - 9, y + 3);
  ctx.bezierCurveTo(x - 9, y + 9, x, y + 13, x, y + 16);
  ctx.bezierCurveTo(x, y + 13, x + 9, y + 9, x + 9, y + 3);
  ctx.bezierCurveTo(x + 9, y - 4, x, y + 2, x, y + 5);
  ctx.fill();
}

function drawHud() {
  for (let i = 0; i < 3; i++) drawHeart(28 + i * 26, 14, i < girl.lives);
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 4;
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const label = `Score: ${score}`;
  ctx.strokeText(label, W - 16, 24);
  ctx.fillText(label, W - 16, 24);
  ctx.font = 'bold 15px system-ui, sans-serif';
  const t = `Time: ${Math.floor(time / 60)}s`;
  ctx.strokeText(t, W - 16, 50);
  ctx.fillText(t, W - 16, 50);
  ctx.textAlign = 'left';
}

function draw() {
  drawField();
  for (const f of flowers) drawFlower(f);
  // Draw things further down the screen on top, so they overlap naturally
  const things = [...snails.map(s => ({ y: s.y, draw: () => drawSnail(s) })), { y: girl.y, draw: drawGirl }];
  things.sort((a, b) => a.y - b.y).forEach(t => t.draw());
  for (const p of sparkles) {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawHud();
}

function loop() {
  if (running) update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  best = Math.max(best, score);
  titleEl.textContent = 'Slimed!';
  subtitleEl.textContent = `Lily lasted ${Math.floor(time / 60)} seconds  ·  Score: ${score}  ·  Best: ${best}`;
  startBtn.textContent = 'Run Again';
  overlay.classList.remove('hidden');
}

function start() {
  reset();
  overlay.classList.add('hidden');
  running = true;
}

window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if (k.startsWith('Arrow')) e.preventDefault();
  if (!running && (k === 'Enter' || k === ' ')) start();
});
window.addEventListener('keyup', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
});
function setTouch(e) {
  e.preventDefault();
  const t = e.touches[0];
  touch.active = true; touch.x = t.clientX; touch.y = t.clientY;
}
canvas.addEventListener('touchstart', setTouch, { passive: false });
canvas.addEventListener('touchmove', setTouch, { passive: false });
canvas.addEventListener('touchend', () => { touch.active = false; });
startBtn.addEventListener('click', start);

reset();
loop();
</script>
</body>
</html>
