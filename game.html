<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Stand</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1b2a1b;
    font-family: system-ui, sans-serif;
    user-select: none;
  }
  canvas { display: block; cursor: crosshair; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    text-align: center;
    padding: 16px;
  }
  #overlay h1 { font-size: 3rem; margin: 0 0 8px; }
  #overlay p { font-size: 1.1rem; margin: 6px 0; opacity: 0.9; }
  #overlay button {
    margin-top: 20px;
    font-size: 1.3rem;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: #e8b13a;
    color: #222;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay button:hover { background: #ffc94d; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1 id="title">Last Stand</h1>
  <p id="subtitle">Enemies are coming at you from every side!</p>
  <p>Aim with your mouse. Click (or hold) to shoot.</p>
  <button id="start">Start</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const startBtn = document.getElementById('start');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const SKIN_TONES = ['#8d5524', '#c68642', '#e0ac69', '#f1c27d', '#ffdbac', '#5c3a1e'];
const SHIRTS = ['#c0392b', '#2c3e50', '#8e44ad', '#16a085', '#d35400', '#7f8c8d'];

const mouse = { x: W / 2, y: 0, down: false };
let player, bullets, enemies, particles, score, wave, spawnTimer, waveTimer, shootCooldown, running, best = 0;

function reset() {
  player = { x: W / 2, y: H / 2, r: 18, hp: 100, maxHp: 100, angle: 0, hurtFlash: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  wave = 1;
  spawnTimer = 0;
  waveTimer = 0;
  shootCooldown = 0;
}

function spawnEnemy() {
  // Pick a random point just outside the screen edge
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const tough = Math.random() < Math.min(0.1 + wave * 0.03, 0.4);
  enemies.push({
    x, y,
    r: tough ? 20 : 15,
    hp: tough ? 3 : 1,
    speed: (tough ? 0.8 : 1.3) + wave * 0.12 + Math.random() * 0.4,
    skin: SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)],
    shirt: SHIRTS[Math.floor(Math.random() * SHIRTS.length)],
    step: Math.random() * Math.PI * 2,
    hitFlash: 0,
  });
}

function shoot() {
  const a = player.angle;
  const muzzle = player.r + 16;
  bullets.push({
    x: player.x + Math.cos(a) * muzzle,
    y: player.y + Math.sin(a) * muzzle,
    vx: Math.cos(a) * 14,
    vy: Math.sin(a) * 14,
  });
  // Muzzle flash sparks
  for (let i = 0; i < 4; i++) {
    const s = a + (Math.random() - 0.5) * 0.6;
    particles.push({
      x: player.x + Math.cos(a) * muzzle, y: player.y + Math.sin(a) * muzzle,
      vx: Math.cos(s) * (3 + Math.random() * 3), vy: Math.sin(s) * (3 + Math.random() * 3),
      life: 8, maxLife: 8, color: '#ffd166', size: 3,
    });
  }
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 25 + Math.random() * 15, maxLife: 40, color, size: 2 + Math.random() * 3,
    });
  }
}

function update() {
  player.x = W / 2;
  player.y = H / 2;
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  if (player.hurtFlash > 0) player.hurtFlash--;

  // Shooting (hold to auto-fire)
  if (shootCooldown > 0) shootCooldown--;
  if (mouse.down && shootCooldown === 0) {
    shoot();
    shootCooldown = 8;
  }

  // Waves get harder over time
  waveTimer++;
  if (waveTimer > 60 * 20) {
    wave++;
    waveTimer = 0;
  }
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(15, 70 - wave * 6);
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1);
      continue;
    }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        bullets.splice(i, 1);
        e.hp--;
        e.hitFlash = 6;
        if (e.hp <= 0) {
          burst(e.x, e.y, e.shirt, 18);
          score += e.r > 15 ? 30 : 10;
          enemies.splice(j, 1);
        } else {
          burst(b.x, b.y, '#fff', 5);
        }
        break;
      }
    }
  }

  // Enemies walk toward you
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy);
    e.x += (dx / d) * e.speed;
    e.y += (dy / d) * e.speed;
    e.step += 0.2 * e.speed;
    if (e.hitFlash > 0) e.hitFlash--;
    if (d < e.r + player.r) {
      player.hp -= e.r > 15 ? 25 : 15;
      player.hurtFlash = 15;
      burst(e.x, e.y, '#ff4d4d', 12);
      enemies.splice(i, 1);
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver();
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.92;
    p.vy *= 0.92;
    if (--p.life <= 0) particles.splice(i, 1);
  }
}

function drawGround() {
  ctx.fillStyle = '#2d4a2d';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawEnemy(e) {
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  const swing = Math.sin(e.step) * 0.5;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(a);

  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath(); ctx.ellipse(3, 4, e.r * 1.1, e.r * 0.9, 0, 0, Math.PI * 2); ctx.fill();

  // Arms reaching forward, swinging as they walk
  ctx.fillStyle = e.skin;
  ctx.beginPath(); ctx.arc(e.r * 0.9 + swing * 4, -e.r * 0.75, e.r * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(e.r * 0.9 - swing * 4, e.r * 0.75, e.r * 0.3, 0, Math.PI * 2); ctx.fill();

  // Body / shoulders
  ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.shirt;
  ctx.beginPath(); ctx.ellipse(0, 0, e.r * 0.7, e.r * 1.05, 0, 0, Math.PI * 2); ctx.fill();

  // Head
  ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.skin;
  ctx.beginPath(); ctx.arc(e.r * 0.15, 0, e.r * 0.55, 0, Math.PI * 2); ctx.fill();
  // Hair
  ctx.fillStyle = '#2b1d10';
  ctx.beginPath(); ctx.arc(e.r * 0.05, 0, e.r * 0.55, Math.PI * 0.55, Math.PI * 1.45); ctx.fill();
  // Angry eyes
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(e.r * 0.5, -e.r * 0.2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(e.r * 0.5, e.r * 0.2, 2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // Health pips for tough enemies
  if (e.r > 15) {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < e.hp ? '#ff5252' : 'rgba(255,255,255,0.25)';
      ctx.fillRect(e.x - 13 + i * 9, e.y - e.r - 12, 7, 4);
    }
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath(); ctx.ellipse(3, 4, player.r * 1.1, player.r * 0.9, 0, 0, Math.PI * 2); ctx.fill();

  // Gun
  ctx.fillStyle = '#333';
  ctx.fillRect(player.r * 0.4, 4, player.r + 12, 7);
  ctx.fillStyle = '#555';
  ctx.fillRect(player.r * 0.4, 2, 12, 10);

  // Body
  ctx.fillStyle = player.hurtFlash > 0 ? '#ff6b6b' : '#3a6ea5';
  ctx.beginPath(); ctx.ellipse(0, 0, player.r * 0.75, player.r * 1.1, 0, 0, Math.PI * 2); ctx.fill();
  // Helmet
  ctx.fillStyle = '#4b5d3a';
  ctx.beginPath(); ctx.arc(player.r * 0.1, 0, player.r * 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2f3b24';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

function drawHud() {
  // Health bar
  const bw = 220, bh = 18;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(16, 16, bw + 4, bh + 4);
  ctx.fillStyle = player.hp > 50 ? '#4caf50' : player.hp > 25 ? '#ffb300' : '#e53935';
  ctx.fillRect(18, 18, bw * (player.hp / player.maxHp), bh);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(`HP ${player.hp}`, 24, 27);

  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`Score: ${score}`, W - 16, 26);
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillText(`Wave ${wave}`, W - 16, 52);
  ctx.textAlign = 'left';

  // Red screen edge when hurt
  if (player.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255, 0, 0, ${player.hurtFlash / 60})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawCrosshair() {
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
  ctx.moveTo(mouse.x - 16, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
  ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 16, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 16); ctx.lineTo(mouse.x, mouse.y - 5);
  ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 16);
  ctx.stroke();
}

function draw() {
  drawGround();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffe066';
  for (const b of bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  for (const e of enemies) drawEnemy(e);
  drawPlayer();
  drawHud();
  drawCrosshair();
}

function loop() {
  if (running) update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  mouse.down = false;
  best = Math.max(best, score);
  titleEl.textContent = 'Game Over';
  subtitleEl.textContent = `Score: ${score}  ·  Wave ${wave}  ·  Best: ${best}`;
  startBtn.textContent = 'Play Again';
  overlay.classList.remove('hidden');
}

function start() {
  reset();
  overlay.classList.add('hidden');
  running = true;
}

canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
// Touch support so it also works on phones/tablets
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.down = false; });
startBtn.addEventListener('click', start);

reset();
loop();
</script>
</body>
</html>
